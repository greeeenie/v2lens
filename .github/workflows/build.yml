name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci --prefix editor
      - name: Build and test editor
        run: |
          npm run build --prefix editor
          node editor/test.mjs
      - name: Test Python
        run: python -m unittest discover -p "test_*.py"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'v'+Path('VERSION').read_text().strip()
      - name: Build portable executable
        run: python build_exe.py
      - name: Validate portable package
        run: python tests/package_smoke.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: V2Lens-windows-x64
          path: |
            dist/V2Lens.exe
            dist/V2Lens-portable.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          dist/V2Lens.exe dist/V2Lens-portable.zip dist/SHA256SUMS.txt
          --verify-tag --title "V2Lens $env:GITHUB_REF_NAME"
          --notes-file .github/RELEASE_NOTES.md
